name: P21 CPU syntax, lint, and evidence checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11.13"

      - name: Install pinned CPU check tools
        run: python -m pip install --disable-pip-version-check --no-input "ruff==0.16.5" "numpy==2.3.4"

      - name: Check Python syntax and formatting
        run: |
          python -m compileall -q examples/dequantize_gemm/p21_fp16xint4.py examples/dequantize_gemm/p21_quickstart.py tools/p21_verify.py
          python -m ruff check examples/dequantize_gemm/p21_fp16xint4.py examples/dequantize_gemm/p21_quickstart.py tools/p21_verify.py
          python -m ruff format --check examples/dequantize_gemm/p21_fp16xint4.py examples/dequantize_gemm/p21_quickstart.py tools/p21_verify.py
          python -m ruff check tools/p21_diagnose.py testing/python/tools/test_p21_fp16_ulp.py
          python -m ruff format --check tools/p21_diagnose.py testing/python/tools/test_p21_fp16_ulp.py
          python testing/python/tools/test_p21_fp16_ulp.py
          python -m compileall -q tools/p21_exact.py
          python -m ruff check tools/p21_exact.py
          python -m ruff format --check tools/p21_exact.py

      - name: Validate retained exact-mode GPU evidence without running CUDA
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("docs/evidence/P21/exact-20261024")
          hashes = json.loads((root / "sha256.json").read_text())
          for name, digest in hashes.items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == digest, name
          result = json.loads((root / "result.json").read_text())
          assert result["pass"] and result["accumulation"] == "exact"
          assert result["target"] == "sm_120"
          assert len(result["shapes"]) == 9
          checks = [*result["small_oracles"].values(), *result["shapes"]]
          assert sum(item["outputs"] for item in checks) == 3174707
          assert all(item["max_ulp"] == 0 for item in checks)
          assert result["overflow_bound_rejected"]
          for name, digest in result["source_sha256"].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
          assert all(len(rows) == 5 for rows in result["timing"]["measurements"].values())
          source = (root / "exact.cu").read_text()
          assert "__double2half" in source and "int64_t" in source and "isfinite" in source
          PY

      - name: Validate retained GPU evidence without running CUDA
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("docs/evidence/P21")
          drive = json.loads((root / "drive-result.json").read_text(encoding="utf-8"))
          bench = json.loads((root / "benchmark-result.json").read_text(encoding="utf-8"))

          assert drive["pass"] is True
          assert drive["target"] == "sm_120"
          assert drive["gpu"] == "NVIDIA GeForce RTX 5080 Laptop GPU"
          assert bench["pass"] is True
          assert bench["target"] == "sm_120"
          assert bench["shape_mnk"] == [128, 256, 256]

          artifact_paths = [drive["upstream_fallback"]["cuda_source"]]
          special = drive["special_values_and_poisoned_odd_tail"]
          assert special["exact_outputs"] == {
              "cancellation": 0, "negative": -15, "zero": 0, "positive": 15
          }
          assert special["unused_high_nibble"] == "poisoned to 0xF for the odd K=5 tail"
          artifact_paths.extend((special["cuda_source"], special["tir"]))
          for case in drive["cases"]:
              assert case["error_vs_cpu_float64_rounded_fp16"]["max_ulp"] <= 2
              artifact_paths.extend((case["generated_cuda_source"], case["tir"]))
          for relative in artifact_paths:
              assert relative.startswith("source/")
              assert (root / relative).is_file(), relative

          medium_source = (root / "source/case-medium-shared.cu").read_text(encoding="utf-8")
          special_source = (root / "source/special-values.cu").read_text(encoding="utf-8")
          assert "__global__" in medium_source and "uchar* __restrict__ B" in medium_source
          assert "B_fp16_shared" in medium_source and "- 16" in medium_source
          assert "< 5" in special_source and "- 16" in special_source

          labels = bench["result"].values()
          assert all("median-only observation" in value for value in labels)
          assert all("no statistical conclusion" in value for value in labels)
          for table_name in ("wall_clock_latency_ms", "cuda_event_latency_ms"):
              table = bench[table_name]
              assert set(table) == {
                  "torch_unpack_plus_matmul", "tilelang_auto",
                  "tilelang_fragment_control", "tilelang_shared_control",
              }
              assert all(len(path["samples"]) == 7 for path in table.values())

          print("Validated retained SM120 GPU evidence; this CPU job did not execute CUDA.")
          PY
